wakeup:
  name: 唤醒车辆
  description: 唤醒处于休眠状态的车辆（远程唤醒，耗电较低）。
  fields:
    vin:
      name: VIN
      description: 目标车辆 VIN（可选，默认使用配置的车辆）
      required: false
      selector:
        text:

refresh:
  name: 立即刷新
  description: 立即拉取一次车辆最新状态（不等下一个轮询周期）。
  fields:
    vin:
      name: VIN
      description: 目标车辆 VIN（可选，默认使用配置的车辆）
      required: false
      selector:
        text:

open_windows:
  name: 物理开窗
  description: 按车辆语义开窗（与 HA cover「打开」反向 UI 无关，供巴法/自动化使用）。
  fields:
    percent:
      name: 开度百分比
      description: 0-100，默认 99（接近全开）。
      required: false
      default: 99
      selector:
        number:
          min: 1
          max: 100

close_windows:
  name: 物理关窗
  description: 按车辆语义关窗（与 HA cover「关闭」反向 UI 无关）。
